[package]
name = "rheon-local-pressure-capture"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
build = "build.rs"

[dependencies]
anyhow = "=1.0.100"
rheon = { git = "https://github.com/MrScripty/Rheon.git", rev = "bc2f472787060d9a69cb619ed2c2fea10fd754b6", default-features = false }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

serde = { version = "=1.0.229", features = ["derive"] }

[features]
default = []
parallel = ["rheon/parallel"]

[build-dependencies]
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
