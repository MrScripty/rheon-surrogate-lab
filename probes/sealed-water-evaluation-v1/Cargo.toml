[package]
name = "rheon-sealed-water-evaluation"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
build = "build.rs"

[dependencies]
anyhow = "=1.0.100"
rheon = { git = "https://github.com/MrScripty/Rheon.git", rev = "43ed26b645dd42de906d0fac7d1ec7d5ab6e351a", default-features = false }
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
serde = { version = "=1.0.228", features = ["derive"] }
sha2 = "=0.10.9"

[build-dependencies]
serde_json = { version = "=1.0.145", features = ["float_roundtrip"] }
sha2 = "=0.10.9"

[lints.rust]
unsafe_code = "forbid"
