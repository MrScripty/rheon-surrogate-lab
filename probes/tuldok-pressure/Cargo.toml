[package]
name = "rheon-tuldok-pressure"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[[bin]]
name = "rheon-trajectory-parallel"
path = "../trajectory/src/main.rs"

[dependencies]
anyhow = "=1.0.100"
rheon = { git = "https://github.com/MrScripty/Rheon.git", rev = "2209012bc5f902693d0f695ec1c2d854126af317", default-features = false, features = ["parallel"] }
serde_json = { version = "=1.0.151", features = ["float_roundtrip"] }

[lints.rust]
unsafe_code = "forbid"
