<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fluid playground</title>
<link rel="stylesheet" href="/static/style.css">
<script type="module" src="/static/app.js"></script>
</head>
<body>
<header class="top">
  <h1>Fluid playground</h1>
  <p class="stats" id="stats" aria-live="off"><span data-stat="backend">–</span><span data-stat="grid">–</span><span data-stat="ms">– ms/step</span><span data-stat="rate">– steps/s</span><span data-stat="rt">– × real time</span></p>
  <span class="status" id="status" data-state="loading">Loading</span>
  <button type="button" id="theme" class="ghost">Dark</button>
</header>
<main class="layout">
  <section class="stage" aria-label="Simulation view">
    <div class="canvas-wrap">
      <canvas id="main-view" role="img" aria-label="Slice of the fluid" tabindex="0"></canvas>
      <canvas id="side-view" class="side" role="img" aria-label="Second slice of the fluid"></canvas>
      <p class="hint" id="hint">Press and drag in the box to push the fluid.</p>
    </div>
    <div class="legend" id="legend">
      <span class="legend-name" id="legend-name">speed</span>
      <span class="legend-min" id="legend-min">0</span>
      <span class="legend-bar" id="legend-bar"></span>
      <span class="legend-max" id="legend-max">0</span>
    </div>
    <p class="message" id="message" role="status"></p>
  </section>

  <aside class="panel">
    <fieldset>
      <legend>Run</legend>
      <div class="row buttons">
        <button type="button" id="pause">Pause</button>
        <button type="button" id="step">Step</button>
        <button type="button" id="reset">Reset</button>
      </div>
      <div class="row segmented" role="radiogroup" aria-label="Pace">
        <label><input type="radio" name="mode" value="realtime" checked> Real time</label>
        <label><input type="radio" name="mode" value="fastest"> Fastest</label>
      </div>
      <div class="row">
        <label for="tracer">Dye</label>
        <select id="tracer"><option value="layer">layer</option><option value="stripes">stripes</option><option value="ball">ball</option><option value="none">none</option></select>
        <button type="button" id="reset-tracer">Reset dye</button>
      </div>
    </fieldset>

    <fieldset>
      <legend>View</legend>
      <div class="row"><label for="field">Field</label>
        <select id="field">
          <option value="tracer">dye (tracer)</option><option value="speed" selected>speed</option>
          <option value="vx">velocity x</option><option value="vy">velocity y</option><option value="vz">velocity z</option>
          <option value="pressure">pressure</option><option value="vorticity">vorticity magnitude</option><option value="divergence">divergence</option>
        </select></div>
      <div class="row"><label for="axis">Cut</label>
        <select id="axis"><option value="z" selected>z (x across, y up)</option><option value="y">y (x across, z up)</option><option value="x">x (z across, y up)</option></select></div>
      <div class="row"><label for="index">Position</label><input type="range" id="index" min="0" max="31" value="16"><output id="index-out" for="index">16</output></div>
      <div class="row"><label><input type="checkbox" id="arrows" checked> Velocity arrows</label></div>
      <div class="row"><label for="side">Small view</label>
        <select id="side"><option value="auto" selected>other cut</option><option value="off">off</option></select></div>
    </fieldset>

    <fieldset>
      <legend>Forces</legend>
      <div class="row segmented" role="radiogroup" aria-label="Force kind">
        <label><input type="radio" name="kind" value="push" checked> Push</label>
        <label><input type="radio" name="kind" value="swirl"> Swirl</label>
        <label><input type="radio" name="kind" value="shake"> Shake</label>
      </div>
      <div class="row"><label for="radius">Radius</label><input type="range" id="radius" min="0.02" max="1" step="0.005" value="0.15"><output id="radius-out" for="radius">0.15 m</output></div>
      <div class="row"><label for="strength">Strength</label><input type="range" id="strength" min="1" max="200" step="1" value="20"><output id="strength-out" for="strength">20 m/s²</output></div>
      <div class="row"><label><input type="checkbox" id="keep"> Keep forces after release</label></div>
      <ul class="forces" id="forces" aria-label="Kept forces"></ul>
      <div class="row"><button type="button" id="clear-forces">Remove all forces</button></div>
    </fieldset>

    <fieldset>
      <legend>Backend and box</legend>
      <div class="row"><label for="backend">Backend</label><select id="backend"></select></div>
      <div class="row"><label for="grid">Grid</label><select id="grid"></select></div>
      <div class="row"><label for="cpm">Cells per metre</label><select id="cpm"></select></div>
      <div class="row"><button type="button" id="apply">Apply (restarts)</button></div>
      <p class="note" id="backend-note"></p>
    </fieldset>
  </aside>
</main>
</body>
</html>
